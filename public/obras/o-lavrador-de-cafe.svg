<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>O Lavrador de Café (releitura) — Candido Portinari</title>
  <rect width="400" height="300" fill="#7fb2d9"/>
  <path d="M0 170 C120 150 250 165 400 150 V300 H0Z" fill="#a9442e"/>
  <!-- cafezal em fileiras -->
  <g fill="#2f6b34">
    <circle cx="200" cy="168" r="8"/><circle cx="230" cy="165" r="8"/><circle cx="260" cy="162" r="8"/><circle cx="290" cy="160" r="8"/><circle cx="320" cy="158" r="8"/><circle cx="350" cy="156" r="8"/><circle cx="380" cy="154" r="8"/>
    <circle cx="215" cy="190" r="10"/><circle cx="250" cy="187" r="10"/><circle cx="285" cy="184" r="10"/><circle cx="320" cy="181" r="10"/><circle cx="355" cy="178" r="10"/><circle cx="390" cy="175" r="10"/>
    <circle cx="240" cy="220" r="12"/><circle cx="282" cy="216" r="12"/><circle cx="324" cy="212" r="12"/><circle cx="366" cy="208" r="12"/>
  </g>
  <!-- trem ao fundo -->
  <rect x="300" y="135" width="40" height="10" fill="#333"/>
  <path d="M305 135 C300 120 320 115 315 100" stroke="#eee" stroke-width="6" fill="none"/>
  <!-- tocos -->
  <g fill="#5a3a22"><rect x="20" y="230" width="18" height="16"/><rect x="60" y="250" width="14" height="12"/></g>
  <!-- lavrador -->
  <g stroke="#2a1a12" stroke-width="2">
    <path d="M95 300 L105 210 H175 L185 300Z" fill="#e6dccb"/>
    <path d="M98 215 C100 170 115 140 140 140 C165 140 180 170 182 215Z" fill="#f2ede2"/>
    <path d="M100 180 C80 200 75 230 82 250" fill="none" stroke="#5a3624" stroke-width="16" stroke-linecap="round"/>
    <path d="M180 180 C200 195 205 220 200 240" fill="none" stroke="#5a3624" stroke-width="16" stroke-linecap="round"/>
    <rect x="128" y="122" width="24" height="22" fill="#5a3624"/>
    <ellipse cx="140" cy="100" rx="24" ry="28" fill="#5a3624"/>
  </g>
  <!-- enxada -->
  <path d="M75 40 V295" stroke="#7a5230" stroke-width="7"/>
  <path d="M60 40 H95 V55 H60Z" fill="#555"/>
  <g fill="#2a1a12"><circle cx="131" cy="96" r="3"/><circle cx="149" cy="96" r="3"/></g>
</svg>
